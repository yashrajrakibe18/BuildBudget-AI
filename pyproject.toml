[project]
name = "buildbudget-ai"
version = "2.0.0"
description = "Multi-agent construction planning, cost estimation and project management platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "jinja2>=3.1", "itsdangerous>=2.2",
  "python-multipart>=0.0.9", "python-dotenv>=1.0", "httpx>=0.27", "pydantic[email]>=2.7",
  "reportlab>=4.0", "openpyxl>=3.1", "apscheduler>=3.10,<4", "pymupdf>=1.24", "python-docx>=1.1",
  "langchain-core>=0.3", "langgraph>=0.2",
]

[project.optional-dependencies]
# install the one provider you use:  uv sync --extra groq   (or google / openai)
groq = ["langchain-groq"]
google = ["langchain-google-genai"]
openai = ["langchain-openai"]   # also used for OpenRouter
postgres = ["psycopg[binary]>=3.2"]   # production database driver
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]   # FastAPI Depends()/Query() in defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "E702"]   # env vars must be set before app imports; compact assertions
