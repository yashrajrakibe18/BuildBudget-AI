[project]
name = "buildbudget-ai"
version = "2.0.0"
description = "Multi-agent construction planning, cost estimation and project management platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "apscheduler>=3.10,<4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
groq = ["langchain-groq"]
google = ["langchain-google-genai"]
openai = ["langchain-openai"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff"]

# Build configuration
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit Python package discovery
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests*", "reports*", "knowledge_base*", "scripts*"]

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]

# Code quality configuration
[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "E702"]